name: CI

on:
  push:
    branches: [main, rebuild]
  pull_request:
  workflow_dispatch:

# Actions are pinned to commit SHAs rather than tags. A tag is mutable - who
# controls the repo can repoint v7 at anything - so a tag pin trusts the
# action owner forever. Dependabot bumps these and the comment tracks which
# release each SHA is.
permissions:
  contents: read

jobs:
  lint:
    name: Lint HTML and CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint:html
      - run: npm run lint:css

  budget:
    name: Page weight budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The first version of this site shipped a 19MB png. This is the guard
      # that stops it coming back.
      - run: tools/check-budget.sh

  headers:
    name: Security headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # tools/serve.py applies the same _headers rules the host will, so the
      # policy is checked on every push rather than only after a deploy.
      - name: Serve with production headers
        run: |
          python3 tools/serve.py 8000 &
          for _ in $(seq 30); do
            curl -sf -o /dev/null http://127.0.0.1:8000/ && break
            sleep 0.2
          done
      - run: tools/check-headers.sh http://127.0.0.1:8000/
      - name: CSP must block inline script
        run: |
          printf '%s\n<script>document.title="EXECUTED";</script>\n' "$(cat index.html)" > /tmp/probe.html
          cp /tmp/probe.html ./probe.html
          title=$(curl -s http://127.0.0.1:8000/probe.html >/dev/null; \
                  google-chrome --headless --disable-gpu --no-sandbox \
                    --virtual-time-budget=4000 --dump-dom \
                    http://127.0.0.1:8000/probe.html 2>/dev/null \
                  | grep -oP '(?<=<title>).*?(?=</title>)')
          rm -f ./probe.html
          echo "title was: $title"
          if [ "$title" = "EXECUTED" ]; then
            echo "CSP did not block inline script"; exit 1
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.24.3
      GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          # Pinning a version without checking the bytes is half a control -
          # a release asset can be replaced after the fact.
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" -C /usr/local/bin gitleaks
          gitleaks version
      # Scan the whole history rather than the pushed range. The official
      # action derives a range from the push event, which breaks after a
      # history rewrite because the "before" commit is now the root and has
      # no parent to diff against.
      - name: Scan full history
        run: gitleaks detect --source . --redact --verbose --exit-code 1

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm install -g @lhci/cli@0.14.x
      - run: lhci autorun

  live:
    name: Deployed site headers
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Checks the real deployment rather than tools/serve.py, so a host
      # misconfiguration is caught too. Skips until SITE_URL is set:
      #   gh variable set SITE_URL --body https://<project>.pages.dev
      - name: Check headers on the deployed site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "${SITE_URL}" ]; then
            echo "SITE_URL repository variable is not set - nothing deployed yet, skipping."
            exit 0
          fi
          tools/check-headers.sh "${SITE_URL}"
