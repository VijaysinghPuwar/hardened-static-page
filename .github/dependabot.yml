version: 2
updates:
  # Keeps the SHA pins in ci.yml current, with the version comment rewritten
  # to match. Without this, pinning to a SHA means never getting fixes.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Lint and audit tooling only - the site itself ships no dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
